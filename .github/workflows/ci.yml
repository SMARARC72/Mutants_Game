name: CI

# Phase 0 PR pipeline (TDD §12.2 subset, D6): lint -> constants parity -> DB/RLS (pgTAP) +
# anon-isolation smoke -> secret scan. Fail-on-red; runs on every PR. Godot/GdUnit4 jobs
# are added in Phase 0.5. Versions pinned (Python 3.12, Node 20, Supabase CLI).

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (gdformat/gdlint, sqlfluff, eslint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install linters
        run: |
          python -m pip install --quiet "gdtoolkit==4.*" "sqlfluff==4.*"
          npm ci
      - name: GDScript (gdformat --check + gdlint, hand-written only)
        run: |
          GD_FILES=$(git ls-files 'client/**/*.gd' | grep -v '^client/addons/' | grep -v '^client/domain/constants.gd' || true)
          echo "linting: $GD_FILES"
          if [ -n "$GD_FILES" ]; then
            gdformat --check $GD_FILES
            gdlint $GD_FILES
          fi
      - name: SQL (sqlfluff — migrations)
        run: sqlfluff lint supabase/migrations --dialect postgres
      - name: JS (eslint)
        run: npm run lint:js
      - name: Domain purity (TDD §3.1 — no Node/addon/wall-clock/global-RNG in domain/)
        run: |
          M=$(git ls-files 'client/domain/**/*.gd' | xargs -r grep -nE '(\bTime\.|\brandf\(|\brandi\(|\brandomize\(|Engine\.get_process_frames|extends (Node|Node2D|Node3D|Control)|res://addons)' || true)
          if [ -n "$M" ]; then echo "$M"; echo "domain/ purity violation (see TDD §3.1)"; exit 1; fi
          echo "domain purity: clean"
      - name: AI selection purity (ADR-016 — selection RNG is canonical-only; no global/addon RNG)
        run: |
          AI_FILES=$(git ls-files 'client/application/ai' 'client/application/battle' | grep '\.gd$' || true)
          M=$(echo "$AI_FILES" | xargs -r grep -nE '(\brandf\(|\brandi\(|\brandf_range\(|\brandi_range\(|\brandomize\(|RandomNumberGenerator)' || true)
          if [ -n "$M" ]; then echo "$M"; echo "AI path RNG violation (ADR-016: draw only from the injected CanonicalRNG via the Blackboard)"; exit 1; fi
          echo "AI selection purity: clean"
      - name: Catalog parity (Cluster 2 — CSV cols + client catalog/Resource/seed id-set ≡, ADR-006)
        run: node tools/test_catalog_parity.mjs

  oracle:
    name: Oracle — constants + RNG parity + determinism + golden (D4/P1)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run generators (must succeed)
        run: |
          node tools/gen_constants.mjs
          node tools/gen_catalog.mjs
          node tools/gen_seed.mjs
      - name: Drift gate (committed generated artifacts up to date)
        run: git diff --exit-code -- client/domain/constants.gd oracle/constants.py client/catalog supabase/seed.sql
      - name: JSON<->engine constants parity (D4)
        run: PYTHONUTF8=1 python -B tools/test_constants_parity.py
      - name: Canonical RNG parity — Python side (ADR-001/002)
        run: PYTHONUTF8=1 python -B tools/test_rng_parity.py
      - name: Oracle determinism — every engine same seed => identical transcript x2
        run: |
          set -e
          cd oracle
          for f in stat_engine level_engine lab_engine battle_engine skill_engine status_engine loot_engine character_engine wire_line; do
            a=$(PYTHONUTF8=1 python -B "$f.py"); b=$(PYTHONUTF8=1 python -B "$f.py")
            if [ "$a" != "$b" ]; then echo "NONDETERMINISTIC: $f"; exit 1; fi
          done
          echo "all engines deterministic"
      - name: Golden vectors regenerate + stability gate (TDD §11.2/§12.2)
        run: |
          PYTHONUTF8=1 python -B tools/gen_golden.py
          git diff --exit-code -- client/tests/golden
      - name: Lab Legality ruleset coverage lint (SpliceRules §7, ADR-015)
        run: PYTHONUTF8=1 python -B tools/test_splice_rules_coverage.py

  database:
    name: DB migrations + RLS (pgTAP) + anon smoke (D2/D3/D5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: supabase/setup-cli@v1
        with:
          version: 2.108.0
      - name: Start local stack
        run: supabase start
      - name: db reset (apply 0001+0002+0003 + seed)
        run: supabase db reset
      - name: pgTAP RLS suite
        run: supabase test db
      - name: Anonymous-isolation smoke test
        run: |
          npm --prefix supabase/tests ci
          export SUPABASE_URL=$(supabase status -o env | grep '^API_URL=' | cut -d'"' -f2)
          export SUPABASE_ANON_KEY=$(supabase status -o env | grep '^ANON_KEY=' | cut -d'"' -f2)
          node supabase/tests/smoke_anon_isolation.mjs
      - name: Stop stack
        if: always()
        run: supabase stop --no-backup || true

  services:
    name: Services — typecheck + unit/contract tests (TDD §7/§11.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install (services)
        working-directory: services
        run: npm ci
      - name: Typecheck (services)
        working-directory: services
        run: npm run typecheck
      - name: Unit/contract tests — generate-once invariant, JWT authz, zod (mocked OpenAI + fake Supabase)
        working-directory: services
        run: npm test

  secret-scan:
    name: Secret scan (D6 guardrail)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Secret gate (deterministic — fails on OpenAI/Anthropic/AWS/private-key/service-role JWT)
        run: bash tools/secret_scan.sh

  godot-tests:
    name: Godot 4.7 addons + GdUnit4 (P0.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.7.0
          use-dotnet: false
      - name: Import project (build cache from committed .uid/.import; loads all 5 addons)
        working-directory: client
        run: godot --headless --import
      - name: GdUnit4 headless test run (sample + Dialogic smoke)
        working-directory: client
        run: godot --headless -s res://addons/gdUnit4/bin/GdUnitCmdTool.gd --add res://tests --ignoreHeadlessMode --continue
